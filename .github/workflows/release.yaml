name: Build and deploy
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: false

      - name: Pull down config.org
        run: curl --fail --location --retry 3 --output src/warm/config.org https://raw.githubusercontent.com/glacials/dotfiles/main/emacs/.config/emacs/config.org

      - name: Install Winter
        run: go install twos.dev/winter@v0.6.1

      - name: Configure deployment commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Incrementally build, check, and deploy
        run: winter publish --allow-dirty
