name: Audit production build

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check out persistent production output
        run: |
          git fetch origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          git worktree add -B gh-pages dist origin/gh-pages

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: false

      - name: Pull down config.org
        run: curl --fail --location --retry 3 --output src/warm/config.org https://raw.githubusercontent.com/glacials/dotfiles/main/emacs/.config/emacs/config.org

      - name: Install Winter
        run: go install twos.dev/winter@v0.6.1

      - name: Audit persistent output against a clean build
        run: winter audit
